# FileGrid FTP storage. Only the single FileGrid service account may log in.
listen=YES
listen_ipv6=NO
background=NO

# --- Access -------------------------------------------------------------------
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=027
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/vsftpd/user_list
# Service account has /sbin/nologin as shell.
check_shell=NO
# Jail the user in its home; the home itself is read-only, data goes in files/.
chroot_local_user=YES
hide_ids=YES

# --- Passive mode (ports published in compose.dev.yaml) -----------------------
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21119
# pasv_address is appended at runtime from FTP_PASV_ADDRESS.

# --- Limits -------------------------------------------------------------------
max_clients=40
max_per_ip=20
idle_session_timeout=300
data_connection_timeout=300

# --- Container quirks ---------------------------------------------------------
seccomp_sandbox=NO
isolate_network=NO

# --- Logging to stdout (picked up by docker / Loki) ----------------------------
xferlog_enable=YES
xferlog_std_format=NO
# Session processes have the client socket on fd 1, so write to PID 1 (tini).
vsftpd_log_file=/proc/1/fd/1
syslog_enable=NO
