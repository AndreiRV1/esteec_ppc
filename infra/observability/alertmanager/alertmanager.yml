# Alerts are e-mailed to the on-call address. Locally the mail lands in Mailpit
# (<public url>/mailpit/); for a real deployment point smtp_smarthost at the
# company relay or add a chat webhook receiver.
global:
  smtp_smarthost: "mailpit:1025"
  smtp_from: "filegrid-alerts@filegrid.local"
  smtp_require_tls: false

templates:
  - /etc/alertmanager/*.tmpl

route:
  receiver: on-call
  group_by: [alertname, requirement, category, backend]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 2h

receivers:
  - name: on-call
    email_configs:
      - to: "on-call@filegrid.local"
        send_resolved: true
        headers:
          Subject: '{{ template "filegrid.subject" . }}'
        html: '{{ template "filegrid.html" . }}'
