# Scrapes every backend replica on its management port (internal network only).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    # One A record per replica: `docker compose up --scale backend=N` just works.
    dns_sd_configs:
      - names: ["backend"]
        type: A
        port: 8081
        refresh_interval: 10s
    # `make dev` mounts a target for the backend running on the host.
    file_sd_configs:
      - files: ["/etc/prometheus/targets/backend-*.yml"]
    metric_relabel_configs:
      # Give HTTP metrics the same `category` label the storage metrics have.
      - source_labels: [uri]
        regex: "/api/v1/meter-readings.*"
        target_label: category
        replacement: METER_READING
      - source_labels: [uri]
        regex: "/api/v1/fault-records.*"
        target_label: category
        replacement: FAULT_RECORD
      - source_labels: [uri]
        regex: "/api/v1/drone-videos.*"
        target_label: category
        replacement: DRONE_VIDEO
      - source_labels: [uri]
        regex: "/api/v1/(admin/)?connection-requests.*"
        target_label: category
        replacement: CONNECTION_DOCUMENTS

  # Is each storage reachable at all? Independent of traffic.
  - job_name: storage
    metrics_path: /probe
    static_configs:
      - targets: ["postgres:5432"]
        labels: { backend: DATABASE, __param_module: tcp_connect }
      - targets: ["ftp:21"]
        labels: { backend: FTP, __param_module: ftp_banner }
      - targets: ["http://minio:9000/minio/health/live"]
        labels: { backend: S3, __param_module: http_2xx }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
