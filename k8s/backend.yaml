# Backend split into category-specific Deployments from the same container image:
#   - backend-meters   (/api/v1/meter-readings)
#   - backend-faults   (/api/v1/fault-records)
#   - backend-videos   (/api/v1/drone-videos)
#   - backend-general  (/api/v1/connection-requests, /api/v1/admin, /api/v1/me, OpenAPI)
#   - meter-processor  (scheduled raw -> meter_reading processor using FOR UPDATE SKIP LOCKED)
#
# Each HTTP API Deployment sets FILEGRID_METER_PROCESSOR_ENABLED="false" and has
# its own HorizontalPodAutoscaler, resource limits and PodDisruptionBudget so a
# 10x burst in one category scales independently without degrading the others.
# Resumable uploads store all progress in PostgreSQL (stored_file), so any
# backend-videos replica can serve the next part.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: filegrid
data:
  FILEGRID_DB_HOST: "postgres"
  # 5 connections per replica (default 20): many small replicas must fit in max_connections.
  SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "5"
  POSTGRES_DB: "filegrid"
  FILEGRID_S3_ENDPOINT: "http://minio:9000"
  FILEGRID_S3_ACCESS_KEY: "filegrid-app"
  FILEGRID_FTP_HOST: "ftp"
  FILEGRID_FTP_PORT: "21"
  FTP_USER: "filegrid"
  FILEGRID_OIDC_ISSUER: "https://localhost:8443/auth/realms/filegrid"
  FILEGRID_OIDC_JWKS_URI: "http://keycloak:8080/auth/realms/filegrid/protocol/openid-connect/certs"
  FILEGRID_KEYCLOAK_URL: "http://keycloak:8080/auth"
  FILEGRID_ALERTMANAGER_URL: "http://alertmanager:9093"
  FILEGRID_PROMETHEUS_URL: "http://prometheus:9090"
  LOGGING_STRUCTURED_FORMAT_CONSOLE: "ecs"
  FILEGRID_TRACE_EXPORT: "true"
  FILEGRID_OTLP_TRACES_ENDPOINT: "http://tempo:4318/v1/traces"
---
# Headless service selecting all backend pods so Prometheus dns_sd_configs
# discovers and scrapes port 8081 on every replica across all 5 Deployments.
apiVersion: v1
kind: Service
metadata:
  name: backend-metrics
  namespace: filegrid
  labels:
    app.kubernetes.io/part-of: filegrid
    app.kubernetes.io/component: backend
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app.kubernetes.io/part-of: filegrid
    app.kubernetes.io/component: backend
  ports:
    - name: management
      port: 8081
      targetPort: 8081
---
# =============================================================================
# 1. Meter readings ingest (/api/v1/meter-readings)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-meters
  namespace: filegrid
  labels:
    app.kubernetes.io/name: backend-meters
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: filegrid
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-meters
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-meters
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: filegrid
    spec:
      containers:
        - name: backend
          image: filegrid/backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: FILEGRID_METER_PROCESSOR_ENABLED
              value: "false"
            - name: FILEGRID_DB_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: filegrid-secrets
                  key: FILEGRID_DB_APP_PASSWORD
            - name: FILEGRID_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: filegrid-secrets
                  key: FILEGRID_S3_SECRET_KEY
            - name: FTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: filegrid-secrets
                  key: FTP_PASSWORD
            - name: FILEGRID_MASTER_KEY_V1
              valueFrom:
                secretKeyRef:
                  name: filegrid-secrets
                  key: FILEGRID_MASTER_KEY_V1
            - name: FILEGRID_IDENTITY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: filegrid-secrets
                  key: FILEGRID_IDENTITY_PEPPER
            - name: FILEGRID_METER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: filegrid-secrets
                  key: FILEGRID_METER_API_KEY
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend-meters
  namespace: filegrid
spec:
  selector:
    app.kubernetes.io/name: backend-meters
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-meters
  namespace: filegrid
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-meters
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-meters
  namespace: filegrid
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-meters
---
