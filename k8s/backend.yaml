kind: Deployment
metadata:
  name: meter-processor
  namespace: filegrid
  labels:
    app.kubernetes.io/name: meter-processor
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: filegrid
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: meter-processor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meter-processor
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: filegrid
    spec:
      containers:
        - name: processor
          image: filegrid/backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: management
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: FILEGRID_METER_PROCESSOR_ENABLED
              value: "true"
            - name: FILEGRID_DB_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: filegrid-secrets
                  key: FILEGRID_DB_APP_PASSWORD
            - name: FILEGRID_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: filegrid-secrets
                  key: FILEGRID_S3_SECRET_KEY
            - name: FTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: filegrid-secrets
                  key: FTP_PASSWORD
            - name: FILEGRID_MASTER_KEY_V1
              valueFrom:
                secretKeyRef:
                  name: filegrid-secrets
                  key: FILEGRID_MASTER_KEY_V1
            - name: FILEGRID_IDENTITY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: filegrid-secrets
                  key: FILEGRID_IDENTITY_PEPPER
            - name: FILEGRID_METER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: filegrid-secrets
                  key: FILEGRID_METER_API_KEY
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
---
