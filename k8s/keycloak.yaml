apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: filegrid
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: filegrid
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: filegrid
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.2@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
          args: ["start", "--import-realm"]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://postgres:5432/keycloak"
            - name: KC_DB_USERNAME
              value: "keycloak"
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: filegrid-secrets
                  key: KEYCLOAK_DB_PASSWORD
            - name: FILEGRID_PUBLIC_URL
              value: "https://localhost:8443"
            - name: KC_HOSTNAME
              value: "https://localhost:8443/auth"
            - name: KC_HTTP_RELATIVE_PATH
              value: "/auth"
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: "admin"
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: filegrid-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: FILEGRID_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: filegrid-secrets
                  key: FILEGRID_ADMIN_PASSWORD
            - name: FILEGRID_DEMO_CLIENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: filegrid-secrets
                  key: FILEGRID_DEMO_CLIENT_PASSWORD
            - name: FILEGRID_DEMO_EMPLOYEE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: filegrid-secrets
                  key: FILEGRID_DEMO_EMPLOYEE_PASSWORD
            - name: GRAFANA_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: filegrid-secrets
                  key: GRAFANA_OAUTH_CLIENT_SECRET
            - name: FILEGRID_KEYCLOAK_BACKEND_SECRET
              valueFrom:
                secretKeyRef:
                  name: filegrid-secrets
                  key: FILEGRID_KEYCLOAK_BACKEND_SECRET
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /auth/health/ready
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /auth/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: filegrid
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keycloak
  namespace: filegrid
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
