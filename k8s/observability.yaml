apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: filegrid
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: filegrid
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: filegrid
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          env:
            - name: MP_WEBROOT
              value: "mailpit"
            - name: MP_SMTP_AUTH_ACCEPT_ANY
              value: "true"
            - name: MP_SMTP_AUTH_ALLOW_INSECURE
              value: "true"
            - name: MP_MAX_MESSAGES
              value: "500"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 8025
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8025
            initialDelaySeconds: 5
            periodSeconds: 10
---
