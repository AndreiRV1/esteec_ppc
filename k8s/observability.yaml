# Observability stack in Kubernetes:
#   - Prometheus (scrapes backend-metrics headless service on port 8081 + blackbox probes)
#   - Blackbox Exporter (probes postgres:5432, ftp:21, minio:9000)
#   - Alertmanager + Mailpit (routes alerts to on-call inbox at /mailpit/)
#   - Loki + Alloy (ships pod logs and extracts trace_id from ECS JSON logs)
#   - Tempo (OTLP trace receiver on 4317/4318)
#   - Grafana (served under /grafana/, Keycloak SSO restricted to realm role `admin`)
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-k8s-config
  namespace: filegrid
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]

    scrape_configs:
      - job_name: backend
        metrics_path: /actuator/prometheus
        dns_sd_configs:
          - names: ["backend-metrics.filegrid.svc.cluster.local"]
            type: A
            port: 8081
            refresh_interval: 10s
        metric_relabel_configs:
          - source_labels: [uri]
            regex: "/api/v1/meter-readings.*"
            target_label: category
            replacement: METER_READING
          - source_labels: [uri]
            regex: "/api/v1/fault-records.*"
            target_label: category
            replacement: FAULT_RECORD
          - source_labels: [uri]
            regex: "/api/v1/drone-videos.*"
            target_label: category
            replacement: DRONE_VIDEO
          - source_labels: [uri]
            regex: "/api/v1/(admin/)?connection-requests.*"
            target_label: category
            replacement: CONNECTION_DOCUMENTS

      - job_name: storage
        metrics_path: /probe
        static_configs:
          - targets: ["postgres:5432"]
            labels: { backend: DATABASE, __param_module: tcp_connect }
          - targets: ["ftp:21"]
            labels: { backend: FTP, __param_module: ftp_banner }
          - targets: ["http://minio:9000/minio/health/live"]
            labels: { backend: S3, __param_module: http_2xx }
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox:9115

      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: filegrid
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: filegrid
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: filegrid
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: prometheus-data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-k8s-config
        - name: rules
          configMap:
            name: prometheus-rules
  volumeClaimTemplates:
    - metadata:
        name: prometheus-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: filegrid
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
