apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: filegrid
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: filegrid
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: filegrid
    spec:
      containers:
        - name: frontend
          image: filegrid/frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KEYCLOAK_URL
              value: "https://localhost:8443/auth"
            - name: KEYCLOAK_REALM
              value: "filegrid"
            - name: KEYCLOAK_CLIENT_ID
              value: "filegrid-web"
            - name: GRAFANA_URL
              value: "/grafana"
            - name: MOCK_API
              value: "false"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: filegrid
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: filegrid
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
