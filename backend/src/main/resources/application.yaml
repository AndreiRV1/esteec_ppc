# All secrets come from the environment (see ../.env.example). Defaults below
# target `make dev` (storages on 127.0.0.1); compose overrides hosts for the container.
spring:
  application:
    name: filegrid
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${FILEGRID_DB_HOST:localhost}:${FILEGRID_DB_PORT:5432}/${POSTGRES_DB:filegrid}
    username: filegrid_app
    password: ${FILEGRID_DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000
  servlet:
    multipart:
      # Fault recordings are 1-10 MB; the storage policy sets the real limit per category.
      max-file-size: 64MB
      max-request-size: 70MB
      # Parts above this are spooled to disk, not held in memory.
      file-size-threshold: 256KB
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens carry the public issuer (Keycloak behind the proxy); keys are fetched
          # over plain HTTP from Keycloak directly (`make dev` publishes it on 8180).
          issuer-uri: ${FILEGRID_OIDC_ISSUER:https://localhost:8443/auth/realms/filegrid}
          jwk-set-uri: ${FILEGRID_OIDC_JWKS_URI:http://localhost:8180/auth/realms/filegrid/protocol/openid-connect/certs}
          audiences: filegrid-api

server:
  shutdown: graceful
  # Behind a TLS-terminating proxy in production.
  forward-headers-strategy: framework

management:
  server:
    # Separate port, never published outside the backend network.
    port: ${FILEGRID_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        # compose turns this on and points it at Tempo.
        enabled: ${FILEGRID_TRACE_EXPORT:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${FILEGRID_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false

springdoc:
  # Set FILEGRID_API_DOCS_ENABLED=false in production.
  api-docs:
    enabled: ${FILEGRID_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${FILEGRID_API_DOCS_ENABLED:true}
    path: /swagger-ui.html

filegrid:
  identity-pepper: ${FILEGRID_IDENTITY_PEPPER}
  meters:
    api-key: ${FILEGRID_METER_API_KEY}
    # How often pending raw readings are turned into meter_reading rows.
    process-interval: ${FILEGRID_METER_PROCESS_INTERVAL:5s}
    batch-size: 200
    # false on instances that only ingest; at least one instance must run the processor.
    processor-enabled: ${FILEGRID_METER_PROCESSOR_ENABLED:true}
  uploads:
    # Part size of resumable uploads (drone videos). S3 needs at least 5 MB.
    part-size: ${FILEGRID_UPLOAD_PART_SIZE:8MB}
  crypto:
    active-key-id: ${FILEGRID_MASTER_KEY_ID:kek-v1}
    master-keys:
      kek-v1: ${FILEGRID_MASTER_KEY_V1}
  storage:
    temp-dir: ${FILEGRID_TEMP_DIR:${java.io.tmpdir}/filegrid}
    s3:
      endpoint: ${FILEGRID_S3_ENDPOINT:http://localhost:9000}
      region: us-east-1
      access-key: ${FILEGRID_S3_ACCESS_KEY}
      secret-key: ${FILEGRID_S3_SECRET_KEY}
      connect-timeout: 3s
      socket-timeout: 30s
    ftp:
      host: ${FILEGRID_FTP_HOST:localhost}
      port: ${FILEGRID_FTP_PORT:2121}
      username: ${FTP_USER}
      password: ${FTP_PASSWORD}
      connect-timeout: 3s
      data-timeout: 30s
