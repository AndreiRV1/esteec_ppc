# Local-development overlay: exposes the storages on 127.0.0.1 so a backend
# running on the host (IDE, `./mvnw spring-boot:run`) can reach them.
# Never use this file on a shared or public machine.
#
#   make dev   (starts everything except the backend container)
#
# The proxy still serves https://localhost:8443: /api is forwarded to the
# backend on the host (port BACKEND_HOST_PORT), so URLs and the token issuer
# are the same as in `make up`.
services:
  backend:
    # In this mode the backend runs on the host: FTP passive replies point at
    # 127.0.0.1, which a containerised backend could not reach.
    profiles: ["backend-in-docker"]

  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

  minio:
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"

  ftp:
    environment:
      # Host clients connect through the published ports, so PASV replies
      # must point at the host loopback, not the container IP.
      FTP_PASV_ADDRESS: 127.0.0.1
    ports:
      - "127.0.0.1:${FTP_HOST_PORT:-2121}:21"
      - "127.0.0.1:21100-21119:21100-21119"

  keycloak:
    ports:
      # Direct access for the host backend (JWKS) and for Keycloak administration.
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-8180}:8080"
    environment:
      # Theme edits show up on reload instead of being cached by Keycloak and the browser.
      KC_SPI_THEME__CACHE_THEMES: "false"
      KC_SPI_THEME__CACHE_TEMPLATES: "false"
      KC_SPI_THEME__STATIC_MAX_AGE: "-1"

  proxy:
    environment:
      BACKEND_HOST: host.docker.internal
      BACKEND_PORT: ${BACKEND_HOST_PORT:-8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prometheus:
    volumes:
      # Scrape the backend running on the host (management port 8081).
      - ./infra/observability/prometheus/targets-dev:/etc/prometheus/targets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
